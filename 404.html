<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | WildCat Studio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231d68bd'><path d='M13 10V3L4 14h7v7l9-11h-7z'/></svg>">
</head>
<body>
  <div class="bg-glow-blue"></div>
  <div class="bg-glow-red"></div>

  <div class="container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
    <div class="brand-icon" style="width: 56px; height: 56px; margin-bottom: 24px;">
      <svg viewBox="0 0 24 24" style="width: 32px; height: 32px;"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    
    <div class="badge-pill" style="margin-bottom: 16px;">
      <span class="pill-dot"></span>
      <span>HTTP 404 • Resource Not Found</span>
    </div>

    <h1 style="font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 12px;">
      <span class="gradient-text-blue">404</span> <span class="gradient-text-red">Lost</span>
    </h1>

    <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 540px; margin-bottom: 32px;">
      The page or asset you are looking for has been moved or does not exist on <strong>wildcatstudio.us</strong>.
    </p>

    <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
      <a href="index.html" class="btn btn-primary">Return to Homepage</a>
      <a href="https://github.com/djacidfx/webtoapp-studio-pro" target="_blank" rel="noopener" class="btn btn-secondary">Visit GitHub Repository</a>
      <a href="https://buymeacoffee.com/wildcatstudio" target="_blank" rel="noopener" class="btn btn-bmac">☕ Buy Me a Coffee</a>
    </div>
  </div>
</body>
</html>
